[project]
name = "tcc-transfer-learning-textcnn-tinybert"
version = "0.1.0"
description = "Transfer learning spaCy TextCNN -> TinyBERT vs TinyBERT + data augmentation (Financial PhraseBank, dados escassos)"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tqdm>=4.66",
    "torch>=2.5",
    "transformers>=4.46",
    "accelerate>=1.0",
    "spacy>=3.8",
    "psutil>=6.0",
    "matplotlib>=3.9",
    "ollama>=0.3",
]

[tool.uv]
package = false
